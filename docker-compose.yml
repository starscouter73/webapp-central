name: webzentrale

services:
  db:
    image: mariadb:11.4
    container_name: webappcentral_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${WP_DB_NAME}
      MARIADB_USER: ${WP_DB_USER}
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - webappcentral_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${DB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress:
    image: wordpress:php8.2-apache
    container_name: webzentrale
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORDPRESS_HOST_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX}
      WORDPRESS_DEBUG: "${WORDPRESS_DEBUG}"
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', 'minor');
        define('AUTOMATIC_UPDATER_DISABLED', false);
        define('WP_DEBUG', false);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', false);
        define('WP_ENVIRONMENT_TYPE', 'production');
        @ini_set('display_errors', '0');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - webappcentral_wordpress_data:/var/www/html
      - webappcentral_uploads_data:/var/www/html/wp-content/uploads
      - ./custom/themes:/var/www/html/wp-content/themes
      - ./custom/plugins:/var/www/html/wp-content/plugins
      - ./custom/snippets:/var/www/html/wp-content/mu-plugins
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

volumes:
  webappcentral_db_data:
  webappcentral_wordpress_data:
  webappcentral_uploads_data:
